# Proxy in front of the single ocr_paddle_model replica. OCR_Paddle_Model never scales out: the container owns the model and, on a GPU, its
# model server, so the upstream has one server. The proxy exists so every model service has the same front door (<name>_lb).
upstream ocr_paddle_model {
    server ocr_paddle_model:29262 max_fails=2 fail_timeout=10s;
}

server {
    listen 29262;
    client_max_body_size 0;       # no limit here: the service enforces its max_body_mb setting
    proxy_request_buffering off;  # page images can be large; do not spool them to disk

    location / {
        proxy_pass http://ocr_paddle_model;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 900s;  # a page on the CPU can take a while
        proxy_next_upstream off;  # one replica: nothing to retry on
    }
}
